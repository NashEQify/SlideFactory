name: CI

# Pull requests only: main moves by merging a checked PR, so a second run after
# the merge would repeat the same work.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    # Chromium and its system libraries come preinstalled; the tag must match
    # the playwright pin in requirements-dev.txt.
    container: mcr.microsoft.com/playwright/python:v1.58.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

      # The committed starters must be exactly what the build produces from src/.
      - name: Build starters and check they are committed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npm run build
          git diff --exit-code --stat -- skills/slidefactory/assets

      - run: python3 -m pip install --break-system-packages -r requirements-dev.txt
      # PDF checks read the printed output with pdfinfo/pdftotext.
      - run: apt-get update && apt-get install -y --no-install-recommends poppler-utils

      - name: Tests
        run: python3 -m pytest -q -n auto
