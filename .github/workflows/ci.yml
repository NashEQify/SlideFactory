name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: Playwright 1.58 has no Chromium build for newer Ubuntu images.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

      # The committed starters must be exactly what the build produces from src/
      # (deck and revision IDs are freshly generated on every build).
      - name: Build starters and check they are committed
        run: |
          npm run build
          git diff --exit-code --stat -I '^  "(deckId|revision)": "[0-9a-f-]+",?$' -- skills/slidefactory/assets

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      # PDF checks read the printed output with pdfinfo/pdftotext.
      - run: sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Tests
        run: python -m pytest -q
